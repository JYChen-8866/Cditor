[package]
name = "cditor-video"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable FFmpeg-backed video preview component for Cditor GPUI applications."

[lib]
name = "cditor_video"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false }
image = "0.25.10"
smallvec = "1.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
cpal = "=0.18.1"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false, features = ["test-support"] }
