[package]
name = "cditor-component"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Reusable GPUI components for Cditor applications."

[lib]
name = "cditor_component"

[features]
default = ["font-kit"]
font-kit = ["gpui/font-kit"]
mobile-text-session = []

[dependencies]
gpui = { package = "gpui-pre", version = "0.3.3", default-features = false }
web-time = "1.1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.3", default-features = false, features = ["test-support"] }
image = { version = "0.25.10", default-features = false }
