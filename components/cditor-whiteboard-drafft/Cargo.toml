[package]
name = "cditor-whiteboard-drafft"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Isolated Drafft Ink and GPUI whiteboard integration."
license = "AGPL-3.0"
publish = false

[features]
default = ["drafft-core"]
drafft-core = ["dep:drafftink-core"]
drafft-vello = ["drafft-core", "dep:drafftink-render"]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kurbo = "0.12"
parley = { version = "=0.11.0", features = ["complex-scripts", "system"] }
peniko = "0.5"
roughr = "0.12"
rfd = "0.15"
serde_json = "1"
rex = { git = "https://github.com/KenyC/ReX", rev = "aeccdba38f3fa54195c469319b65c423e17a77ae", features = ["ttfparser-fontparser"] }
ttf-parser = "0.25"
tiny-skia = "0.11"
# Directly reuse the vendored upstream model and renderer instead of
# reimplementing their public contracts. See UPSTREAM.md for provenance.
drafftink-core = { path = "vendor/drafft-ink/crates/drafftink-core", optional = true }
drafftink-render = { path = "vendor/drafft-ink/crates/drafftink-render", optional = true }

[dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", features = ["font-kit"] }

# Cargo only applies patches from the top-level package being built. Repeat the
# vendored upstream workspace patch verbatim so drafftink-render uses the same
# Vello revision and wgpu 27 combination as upstream.
[patch.crates-io]
vello = { git = "https://github.com/linebender/vello", rev = "1771112ebc0ae04d996ebf493d3a00d73303f014" }

[[example]]
name = "build_vello_scene"
path = "examples/build_vello_scene.rs"
required-features = ["drafft-vello"]

[[example]]
name = "gpui_board"
path = "examples/gpui_board.rs"
