[package]
name = "cditor-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cditor_editor"

[features]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dev-dependencies]
async-trait = "0.1"

[dependencies]
cditor-ai = { path = "../cditor-ai" }
cditor-api = { path = "../cditor-api" }
cditor-core = { path = "../cditor-core" }
cditor-import-export = { path = "../cditor-import-export" }
cditor-text = { path = "../cditor-text" }
cditor-editor-core = { path = "../cditor-editor-core" }
cditor-runtime = { path = "../cditor-runtime" }
cditor-storage = { path = "../cditor-storage" }
cditor-theme = { path = "../cditor-theme" }
ding-board = { path = "../ding-board" }
tokio = { version = "1", features = ["time"] }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false, features = ["font-kit", "test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false, features = ["font-kit"] }
mermaid_render = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.9"
unicode-segmentation = "1.12"
image = "0.25.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
lumis = { version = "0.12.0", default-features = false, features = [
    "lang-bash", "lang-c", "lang-cpp", "lang-csharp", "lang-css",
    "lang-diff", "lang-dockerfile", "lang-go", "lang-html",
    "lang-java", "lang-javascript", "lang-json", "lang-kotlin",
    "lang-markdown", "lang-python", "lang-rust", "lang-scss",
    "lang-sql", "lang-swift", "lang-toml", "lang-tsx",
    "lang-typescript", "lang-yaml", "lang-zsh",
] }
