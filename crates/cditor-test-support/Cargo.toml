[package]
name = "cditor-test-support"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
cditor-core = { path = "../cditor-core" }
cditor-editor-protocol = { path = "../cditor-editor-protocol" }
cditor-runtime = { path = "../cditor-runtime" }
cditor-session = { path = "../cditor-session" }
cditor-storage = { path = "../cditor-storage" }
cditor-viewport = { path = "../cditor-viewport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bench]]
name = "frame_baseline"
harness = false

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }
