[package]
name = "dc-board"
version = "0.1.0"
edition = "2024"
description = "OneNote-style infinite canvas with Cditor containers"
license = "GPL-3.0-or-later"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }
cditor-api = { path = "../cditor-api" }
cditor-editor = { path = "../cditor-editor" }
cditor-core = { path = "../cditor-core" }
cditor-runtime = { path = "../cditor-runtime" }
log = "0.4"

[dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe" }

[[example]]
name = "demo"
path = "examples/demo.rs"
