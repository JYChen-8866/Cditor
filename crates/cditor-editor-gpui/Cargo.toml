[package]
name = "cditor-editor-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cditor_editor_gpui"

[features]
default = ["full", "test-support"]
full = ["font-kit", "code-highlight", "mermaid", "whiteboard"]
runtime-shaders = ["gpui_platform/runtime_shaders"]
font-kit = ["gpui/font-kit"]
test-support = ["gpui/test-support"]
mobile-text-session = ["cditor-component/mobile-text-session"]
code-highlight = ["dep:lumis"]
mermaid = ["dep:mermaid_render"]
whiteboard = ["dep:cditor-whiteboard", "dep:cditor-whiteboard-gpui"]

[dev-dependencies]
cditor-test-support = { path = "../cditor-test-support" }
async-trait = "0.1"
futures-lite = "2"
tokio = { version = "1", features = ["rt", "time"] }

[dependencies]
async-channel = "2"
cditor-ai = { path = "../cditor-ai" }
cditor-config = { path = "../cditor-config" }
cditor-sdk = { path = "../cditor-sdk" }
cditor-core = { path = "../cditor-core" }
cditor-editor-protocol = { path = "../cditor-editor-protocol" }
cditor-import-export = { path = "../cditor-import-export" }
cditor-text = { path = "../cditor-text" }
cditor-viewport = { path = "../cditor-viewport" }
cditor-runtime = { path = "../cditor-runtime" }
cditor-session = { path = "../cditor-session" }
cditor-theme = { path = "../cditor-theme" }
cditor-component = { path = "../../components/cditor-component" }
cditor-whiteboard = { path = "../../components/cditor-whiteboard", optional = true }
cditor-whiteboard-gpui = { path = "../../components/cditor-whiteboard-gpui", optional = true }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false, features = ["font-kit"] }
mermaid_render = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.9"
unicode-segmentation = "1.12"
url = "2"
web-time = "1.1"
image = "0.25.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
lumis = { version = "0.12.0", default-features = false, optional = true, features = [
    "lang-bash", "lang-c", "lang-cpp", "lang-csharp", "lang-css",
    "lang-go", "lang-html",
    "lang-java", "lang-javascript", "lang-json",
    "lang-python", "lang-rust",
    "lang-sql", "lang-swift", "lang-toml",
    "lang-typescript", "lang-yaml",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
rfd = "0.15"
