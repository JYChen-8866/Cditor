[package]
name = "cditor-storage-markdown"
version = "0.1.0"
edition = "2024"

[dependencies]
cditor-core = { path = "../cditor-core" }
cditor-storage = { path = "../cditor-storage" }

async-trait = "0.1"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
pulldown-cmark = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tempfile = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
