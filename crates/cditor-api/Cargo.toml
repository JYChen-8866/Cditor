[package]
name = "cditor-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "cditor_api"

[dependencies]
async-trait = "0.1"
cditor-ai = { path = "../cditor-ai" }
cditor-core = { path = "../cditor-core" }
cditor-editor-core = { path = "../cditor-editor-core" }
cditor-runtime = { path = "../cditor-runtime" }
cditor-storage = { path = "../cditor-storage" }
cditor-storage-postgres = { path = "../cditor-storage-postgres" }
cditor-storage-sqlite = { path = "../cditor-storage-sqlite" }
cditor-theme = { path = "../cditor-theme" }
ding-board = { path = "../ding-board" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false, features = ["font-kit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
