[package]
name = "mermaid_render"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/mermaid_render.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow = "1"
gpui = { package = "gpui-pre", version = "0.3.3", default-features = false }
merman = { git = "https://github.com/zed-industries/merman", tag = "v0.6.2-with-patches", features = ["render"] }
quick-xml = "0.38.4"
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.3", default-features = false, features = ["test-support"] }
