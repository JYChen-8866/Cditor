[package]
name = "cditor-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cditor WASM web entry point"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# cditor crates — default-features = false to skip font-kit (not available on WASM)
# mermaid 暂时移除：gpui-pre 迁移未完成，见 cditor-editor-gpui/Cargo.toml
cditor-editor-gpui = { path = "../../crates/cditor-editor-gpui", default-features = false, features = ["whiteboard"] }
cditor-runtime = { path = "../../crates/cditor-runtime" }
cditor-sdk = { path = "../../crates/cditor-sdk" }
# GPUI — no font-kit on WASM
gpui = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "1d217ee39d381ac101b7cf49d3d22451ac1093fe", default-features = false }

# WASM bridge
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
console_log = "1.0"
log = "0.4"
