[package]
name = "cditor-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["full"]
full = [
    "ai",
    "code-highlight",
    # "mermaid",  # gpui-pre 迁移未完成，见 cditor-editor-gpui/Cargo.toml
    "whiteboard",
]
ai = ["dep:cditor-ai-openai"]
code-highlight = ["cditor-editor-gpui/code-highlight"]
mermaid = ["cditor-editor-gpui/mermaid"]
whiteboard = ["cditor-editor-gpui/whiteboard"]

[dependencies]
cditor-sdk = { path = "../../crates/cditor-sdk" }
cditor-ai-openai = { path = "../../crates/cditor-ai-openai", optional = true }
cditor-editor-gpui = { path = "../../crates/cditor-editor-gpui", default-features = false, features = ["font-kit"] }
cditor-core = { path = "../../crates/cditor-core" }
cditor-runtime = { path = "../../crates/cditor-runtime" }
cditor-session = { path = "../../crates/cditor-session" }
cditor-storage = { path = "../../crates/cditor-storage" }
gpui = { package = "gpui-pre", version = "0.3.3", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.3", default-features = false, features = ["font-kit"] }
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3.3", default-features = false, features = ["test-support"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
