[workspace]
members = [
    "crates/cditor-config",
    "crates/cditor-ai",
    "crates/cditor-ai-openai",
    "crates/cditor-core",
    "crates/cditor-editor-protocol",
    "crates/cditor-theme",
    "crates/cditor-storage",
    "crates/cditor-runtime",
    "crates/cditor-session",
    "crates/cditor-viewport",
    "crates/cditor-editor-gpui",
    "crates/cditor-import-export",
    "crates/cditor-sdk",
    "crates/cditor-http-server",
    "apps/cditor-desktop",
    "crates/cditor-test-support",
    "crates/cditor-text",
    "components/cditor-component",
    "components/cditor-video",
    "components/cditor-whiteboard",
    "components/cditor-whiteboard-gpui",
    "apps/cditor-web",
    "vendor/mermaid_render",
]
exclude = ["extensions/zed-cditor"]
default-members = ["apps/cditor-desktop"]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"

[profile.editor-dev]
inherits = "dev"
opt-level = 2
debug = 1
debug-assertions = true
overflow-checks = true
lto = "off"
incremental = true
codegen-units = 16

[profile.release]
opt-level = 3
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
